<!DOCTYPE html>
<html>
    <body>
        <b> Thử nghiệm<br></b>

        <strong>Thử nghiệm<br></strong>

        <!--Hai cái này cơ bản gần như giống hệt nhau, bold-->

        <i>Thử nghiệm<br></i>

        <em>Thử nghiệm<br></em>

        <!--Hai cái này cơ bản gần như giống hệt nhau, italic-->

        <mark>Thử nghiệm<br></mark>

        <!--Đánh dấu vào text giống bút nhớ ấy-->

        <small>Thử nghiệm<br></small>

        <!--Ờ thì bằng 80% thẻ <a>. Thẻ này chủ yếu dùng trong comment, bla bla-->

        <del>Thử ngiệm<br></del> 

        <!--Gạch ngang chữ-->

        <ins>Thử nghiệm<br></ins>

        <!--Gạch dưới chữ-->

        <p>Đây là một<sub>Thử nghiệm</sub> mẫu<br></p>

        <!--Chữ trong thẻ <sub> sẽ hiện phía trên -->

        <p>Hai<sup>ba</sup><br></p>

        <!--Chữ trong thẻ <sup> sẽ hiện phía -->


    </body>

</html>
