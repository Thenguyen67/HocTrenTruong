<!DOCTYPE html>
<html>
     <body>
          <!--1. Thuộc tính href-->
          <a href="https://github.com/Thenguyen67/HTML">Chuyển đến trang</a>

          <!-- thẻ <a> là viết tắt của anchor, dùng để tạo ra những dòng chữ có thể chứa liên kết.
               Phải dùng với href thì mới thêm liên kết được-->

          <!--2. Thuộc tính src-->
          <img src="../IMG/anh-bao-chi.jpg.webp" alt ="Ảnh đại hội XIV" width="300" height="300" >
          
          <!--thẻ <img> dùng để hiển thị hình ảnh. src dùng để đưa ra link dẫn đến ảnh.
          Khi ảnh nằm khác với thư mục file HTML, ta thêm "../" để dẫn đến thư mục.
          
          witdth là chiều rộng ảnh, height là chiều cao
          
          alt dùng để hiển thị mô tả ảnh để người dùng biết nội dung ảnh trong trường hợp
          ảnh bị lỗi hiển thị-->

     </body>
</html>
