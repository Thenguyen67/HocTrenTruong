<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - POS</title>
    <link rel="stylesheet" href="/staff/css/Style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h2>Xác Thực Nhân Viên</h2>
            <p>Vui lòng nhập mã PIN 6 số</p>
        </div>

        <form id="pinForm">
            <div class="pin-group">
                <input type="password" class="pin-input" maxlength="1" inputmode="numeric" autofocus required>
                <input type="password" class="pin-input" maxlength="1" inputmode="numeric" required>
                <input type="password" class="pin-input" maxlength="1" inputmode="numeric" required>
                <input type="password" class="pin-input" maxlength="1" inputmode="numeric" required>
                <input type="password" class="pin-input" maxlength="1" inputmode="numeric" required>
                <input type="password" class="pin-input" maxlength="1" inputmode="numeric" required>
            </div>

            <!-- Thông báo lỗi/thành công hiển thị tại đây thay vì alert() -->
            <div id="message" class="message hidden"></div>

            <button type="submit" class="submit-btn">Đăng Nhập</button>
        </form>
    </div>

    <script src="/staff/js/Script.js"></script>
</body>
</html>
